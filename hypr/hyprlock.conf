# Lock screen: the lock wallpaper, the time and date, and a light password field.
# Locking itself (when and how) lives in scripts/lock.sh and hypridle.conf.

$text = rgba(200, 200, 200, 1.0)
$shadow = rgba(0, 0, 0, 0.6)

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/lockW.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 0
}

# Fade in over 0.5 s; the password field changes color over 0.3 s when checking or failing
animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = inputFieldColors, 1, 3, linear
}

# Time, at the top of the screen (negative y moves down from the top edge)
label {
    monitor =
    text = cmd[update:1000] date "+%H:%M:%S"
    color = $text
    font_size = 55
    font_family = JetBrainsMonoNL Nerd Font
    position = 0, -60
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $shadow
}

# Date, right under the time
label {
    monitor =
    text = cmd[update:1000] date "+%A, %B %d, %Y"
    color = $text
    font_size = 20
    font_family = JetBrainsMonoNL Nerd Font
    position = 0, -150
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $shadow
}

# Password field, at the bottom of the screen (positive y moves up from the bottom edge)
input-field {
    monitor =
    size = 280, 50
    position = 0, 80
    halign = center
    valign = bottom

    outline_thickness = 3
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    font_family = JetBrainsMonoNL Nerd Font

    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true

    # Hidden until the first keystroke, and again 1 s after clearing it
    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <span foreground="##787878"><i>Password...</i></span>
    check_color = rgb(0, 150, 0)
    fail_color = rgb(200, 0, 0)
    fail_text = <i>Wrong Password!</i>
    capslock_color = rgb(240, 0, 0)
}

auth {
    fingerprint:enabled = false
}
