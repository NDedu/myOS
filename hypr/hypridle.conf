# Idle behavior: screensaver after 10 minutes, lock after 15, but only while idle is allowed.
#
# Default is "stay awake": nothing happens on idle. Allow idle with the coffee cup icon in the bar,
# SUPER + CTRL + I, or Toggle > Idle Lock in the menu. That creates ~/.local/state/hypr/allow-idle,
# which every listener below checks, so hypridle keeps running and needs no restart.

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh                           # loginctl lock-session
    after_sleep_cmd = sleep 1 && ~/.config/hypr/scripts/wake.sh         # after suspend, turn the displays on

    # Lock before suspend (menu Suspend, lid close), without turning displays off
    # before_sleep_cmd = LOCK_ONLY=true ~/.config/hypr/scripts/lock.sh
    # inhibit_sleep = 3                                                 # hold suspend until the screen is locked
}

# Screensaver after 10 minutes
listener {
    timeout = 600
    on-timeout = [ -f ~/.local/state/hypr/allow-idle ] && ! pidof hyprlock >/dev/null && ~/.config/hypr/scripts/launch-screensaver.sh
}

# Lock after 15 minutes
listener {
    timeout = 900
    on-timeout = [ -f ~/.local/state/hypr/allow-idle ] && ~/.config/hypr/scripts/lock.sh
    on-resume = ~/.config/hypr/scripts/wake.sh
}

# Also lock 5 minutes into a running screensaver. If opening the screensaver counts as activity
# and restarts the idle timers, the 15 minute listener above would only fire at 25 minutes; this
# one still locks at 10 + 5 = 15. Otherwise it fires at 5 minutes with no screensaver and does nothing.
listener {
    timeout = 300
    on-timeout = [ -f ~/.local/state/hypr/allow-idle ] && pgrep -f '[o]rg.hypr.screensaver' >/dev/null && ~/.config/hypr/scripts/lock.sh
}
