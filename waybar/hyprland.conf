# Waybar integration for Hyprland (0.53+ window rule syntax)
# Source from hyprland.conf:
#   source = ~/.config/waybar/hyprland.conf

# Start the bar (goes through uwsm when the session uses it)
exec-once = ~/.config/waybar/scripts/restart-waybar.sh

# Float the terminals the bar opens (wifi, bluetooth, audio, btop, timezone, updates)
windowrule = float on, match:class ^(org\.waybar\..*)$
windowrule = center on, match:class ^(org\.waybar\..*)$
windowrule = size 875 600, match:class ^(org\.waybar\..*)$

# Hyprland older than 0.53 uses this syntax instead:
# windowrulev2 = float, class:^(org\.waybar\..*)$
# windowrulev2 = center, class:^(org\.waybar\..*)$
# windowrulev2 = size 875 600, class:^(org\.waybar\..*)$

bind = SUPER SHIFT, SPACE, exec, ~/.config/waybar/scripts/toggle-waybar.sh
bind = SUPER CTRL, I, exec, ~/.config/waybar/scripts/toggle-idle.sh  # stay awake / allow idle lock
bind = SUPER CTRL, comma, exec, ~/.config/waybar/scripts/toggle-notification-silencing.sh
