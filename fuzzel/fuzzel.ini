# App launcher (SUPER + ALT + SPACE) and the picker for every menu, in the solitude colors.
# Check changes with: fuzzel --check-config

[main]
font=JetBrainsMonoNL Nerd Font:size=13
prompt=""
placeholder=Search...
icon-theme=Papirus-Dark
terminal=ghostty -e
width=50
lines=8
horizontal-pad=20
vertical-pad=20
inner-pad=12
line-height=26
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=101315f2
text=caccccff
prompt=caccccff
placeholder=cacccc80
input=caccccff
match=a5aeb4ff
selection=cacccc12
selection-text=798186ff
selection-match=a5aeb4ff
counter=4b4e55ff
border=caccccff

[border]
width=2
radius=6
